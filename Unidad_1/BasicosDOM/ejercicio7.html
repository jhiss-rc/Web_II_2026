<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICICO 7 ATRIBUTOS CON SETATTRIBUTE</title>
</head>
<body>
    <div id="elemento">ATRIBUTO</div>
    <script>
        const elemento = document.getElementById('elemento');
        // asignar un nuevo atributo al elemento (una etiqueta , etc)
        // ejemplo: se envia un data, datos especificos a una variable
        // es como value
        elemento.setAttribute('data-nuevoAt','valor222') 
        console.log(elemento)
    </script>
</body>
</html>
