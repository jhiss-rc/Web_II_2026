<!DOCTYPE html>
<html lang="en">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 2 SELECCION DE ELEMENTOS POR CLASE</title>
</head>
<body>
    <div class="clase-1">eLEMENTO 1</div>
    <div class="clase-1">eLEMENTO 2</div>
    <div class="clase-1">eLEMENTO 3</div>
    <script> 
       const elementos = document.getElementsByClassName('clase-1'); //agarrar por clase 
       for(const elemento of elementos){
        elemento.style.backgroundColor = '#880d1e'; // color fondo propiedad css (style)
        elemento.style.color = 'white'; // color texto
       }
    </script>
</body>
</html
