<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 13 PREVETDEFAULT</title>
</head>
<body>
    <div id="enlace" href="https://www.google.com">enlace</div>
    <script>
        const enlace = document.getElementById('enlace');
        enlace.addEventListener('click', (evento)=>{
            // se quita todas las propiedades que tiene el enlace para que no se ejecute su comportamiento por defecto
            evento.preventDefault(); // previene el comportamiento por defecto del enlace
            alert('enlace bloqueado')
        })
    </script>
</body>
</html>
